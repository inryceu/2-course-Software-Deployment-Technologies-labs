hostname: ${hostname}
manage_etc_hosts: true

users:
  - default
  - name: ansible
    gecos: Ansible Automation User
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - qemu-guest-agent
  - python3
  - python3-apt
  - sudo
  - curl
  - git

runcmd:
  - systemctl enable --now qemu-guest-agent
