---
- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true

- name: Create teacher user
  ansible.builtin.user:
    name: "{{ teacher_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    password: "{{ teacher_password_plain | password_hash('sha512', 'lab4teacher') }}"
    state: present

- name: Allow SSH through firewall
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow HTTP on worker nodes
  community.general.ufw:
    rule: allow
    port: "{{ http_port }}"
    proto: tcp
  when: "'workers' in group_names"

- name: Allow MariaDB only from worker VM
  community.general.ufw:
    rule: allow
    port: "3306"
    proto: tcp
    src: "{{ hostvars[groups['workers'][0]].ansible_host | default(hostvars[groups['workers'][0]].ansible_default_ipv4.address) }}"
  when: "'db' in group_names"

- name: Enable UFW with deny-by-default incoming policy
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
