---
- name: Install MariaDB server and Python client dependencies
  ansible.builtin.apt:
    name: "{{ mariadb_packages }}"
    state: present
    update_cache: true

- name: Configure MariaDB bind address
  ansible.builtin.template:
    src: 50-server.cnf
    dest: "{{ mariadb_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart MariaDB

- name: Ensure MariaDB service is enabled and running
  ansible.builtin.systemd:
    name: mariadb
    enabled: true
    state: started

- name: Flush MariaDB handlers before provisioning database
  ansible.builtin.meta: flush_handlers

- name: Create application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create application database user restricted to worker host
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "{{ hostvars[groups['workers'][0]].ansible_host | default(hostvars[groups['workers'][0]].ansible_default_ipv4.address) }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
